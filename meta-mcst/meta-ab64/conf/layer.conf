# REIMU-5564 (1Э8СВ-uATX): A/B firmware on its one 64 MiB BMC flash, kernel 6.18,
# a rootfs slimmed to fit two copies. Goes after meta-device-reimu-5564.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "reimu-ab64-layer"
BBFILE_PATTERN_reimu-ab64-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_reimu-ab64-layer = "10"
LAYERSERIES_COMPAT_reimu-ab64-layer = "warrior zeus dunfell gatesgarth"

# 6.18 keeps the ASPEED device trees in arch/arm/boot/dts/aspeed/
KERNEL_DEVICETREE_reimu-5564 = "aspeed/aspeed-bmc-mcst-reimu-5564.dtb"
PREFERRED_VERSION_linux-aspeed = "6.18%"

# Slot A and the rwfs in the static image (KiB, see reimu-ab64.dtsi); slot B
# is added by do_generate_ab
FLASH_KERNEL_OFFSET_reimu-5564 = "1024"
FLASH_ROFS_OFFSET_reimu-5564 = "7168"
FLASH_RWFS_OFFSET_reimu-5564 = "56320"
REIMU_AB_KERNEL_B_OFFSET = "28672"
REIMU_AB_ROFS_B_OFFSET = "34816"
