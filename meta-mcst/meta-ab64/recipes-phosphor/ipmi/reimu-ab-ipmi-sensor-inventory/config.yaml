# IPMI sensors (SDR) of REIMU-5564: the host state sensors of the example
# config (boot progress, OS status, boot attempts, PSU redundancy) and the
# platform's temperatures as phosphor-hwmon publishes them while it is
# powered (names: hwmon-instantiator from the PNS device tree 1.0/2.0;
# none while the platform is off: no reading). Voltages/fans (pmbus,
# emc2305 without tach) are not mapped: their names depend on the drivers.
