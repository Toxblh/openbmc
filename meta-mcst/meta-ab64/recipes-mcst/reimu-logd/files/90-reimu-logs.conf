# A week and more of journal in RAM, nothing to the NOR flash (what must survive
# a power loss goes to reimu-logd's small log). After the two drop-ins that set
# 64M (systemd-conf) and 5M (tmux-logger): the last one wins.
[Journal]
Storage=volatile
Compress=yes
# no syslog daemon in the image; no wall: nobody logged in reads it there
ForwardToSyslog=no
ForwardToWall=no
ForwardToKMsg=no
ForwardToConsole=no
RuntimeMaxUse=64M
RuntimeKeepFree=64M
