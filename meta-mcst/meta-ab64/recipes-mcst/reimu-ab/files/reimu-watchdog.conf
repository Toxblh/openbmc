# The BMC watchdog (WDT1) is armed by U-Boot for 300 s before the kernel
# starts (reimu-ab.env); the kernel keeps it fed until systemd opens it
# (watchdog.open_timeout=300) and systemd from then on: a hang anywhere
# resets the BMC, and U-Boot counts it as a failed boot of the slot.
[Manager]
RuntimeWatchdogSec=60
