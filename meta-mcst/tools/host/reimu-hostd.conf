# reimu-hostd: the host agent for the REIMU BMC (reimu-hostd.py --help)
# The BMC (written by pairing): its eth0 MAC gives its IPv6 link-local
# address, tried first on every interface that is up; then BMC_IPV4.
BMC_MAC=
BMC_IPV4=
BMC_PORT=5564
# HOST[:PORT] instead of the above
#BMC=
# interfaces to look for the BMC on (default: all up)
#IFACES=enp1s1f1
#DISCOVERY=yes
# seconds between metrics
#INTERVAL=10
# the GPU fan in manual mode never below this, % (20..100)
#GPU_FAN_FLOOR=30
# no word from the BMC: % held while the card is under 70 C; 0: to the driver
#GPU_FAN_LINK_LOST=40
# no word from the BMC this long: the GPU fan back to the driver's control
#LINK_LOST_SEC=60
# what the BMC may ask for (gpu_fan gpu_turbo os_power edac_load), and what
# the agent does by itself: usb_hub (the BMC's virtual USB hub kept awake),
# bmc_owns_i2c (the BMC the only master of the shared I2C buses: the host's
# drivers on them unbound, pwmd stopped; see README.md for what that means
# with the BMC down)
# usb_net (the BMC's USB network: tried first, brought up if nothing else
# does, its default route below the LAN's when the BMC gives internet)
#ALLOW=gpu_fan gpu_turbo os_power edac_load diag usb_hub bmc_owns_i2c usb_net
# modprobe e2k_edac at start when EDAC is not loaded (ECC error counters)
#EDAC_AUTOLOAD=no
# SMART health by smartctl (when installed) every 10 min
#SMART=yes
