# reimu-hostd: the host agent for the REIMU BMC (reimu-hostd.py --help)
# The BMC (written by pairing): its eth0 MAC gives its IPv6 link-local
# address, tried first on every interface that is up; then BMC_IPV4.
BMC_MAC=
BMC_IPV4=
BMC_PORT=5564
# HOST[:PORT] instead of the above
#BMC=
# interfaces to look for the BMC on (default: all up)
#IFACES=enp1s1f1
#DISCOVERY=yes
# seconds between metrics
#INTERVAL=10
# the GPU fan in manual mode never below this, % (20..100)
#GPU_FAN_FLOOR=30
# no word from the BMC this long: the GPU fan back to the driver's control
#LINK_LOST_SEC=60
# what the BMC may ask for (gpu_fan gpu_turbo os_power edac_load)
#ALLOW=gpu_fan gpu_turbo os_power edac_load
# modprobe e2k_edac at start when EDAC is not loaded (ECC error counters)
#EDAC_AUTOLOAD=no
# SMART health by smartctl (when installed) every 10 min
#SMART=yes
