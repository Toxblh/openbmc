# reimu-bootguard settings (see /usr/sbin/reimu-bootguard)

# A freshly installed image must become healthy before this uptime (seconds),
# otherwise WDT2 (armed by U-Boot for 300 s) restarts the BMC from the backup
# flash chip.
HEALTH_DEADLINE=240

# Health check of a new image: these units must be active, the URL must
# answer, and HEALTH_CMD (if set) must exit with 0.
HEALTH_UNITS="bmcweb.socket reimu-serial.service"
HEALTH_URL="https://127.0.0.1/redfish/v1"
HEALTH_CMD=""

# Copy the confirmed image to the backup chip right after the commit.
AUTO_SYNC=yes
