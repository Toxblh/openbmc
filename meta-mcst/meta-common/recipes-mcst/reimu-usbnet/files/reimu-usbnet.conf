# reimu-usbnet: the USB network between the BMC and its host (a network card
# on the BMC's virtual USB hub; see /usr/libexec/reimu-usbnet). The web page
# Хост → «USB-сеть с хостом» changes ENABLED and INTERNET here. By hand:
#   reimu-usbnet set internet on|off      reimu-usbnet set enabled on|off
#   systemctl restart reimu-usbnet         (after an edit of NET)
#
# the USB network itself
#ENABLED=yes
# the host's internet through the BMC's port (NAT out of eth0): 100 Mbit/s at
# most, and it takes the BMC's CPU; a host with its own cable keeps using that
#INTERNET=no
# the BMC's IPv4 address and prefix on usb0; the host gets one by DHCP
#NET=172.31.83.1/29
