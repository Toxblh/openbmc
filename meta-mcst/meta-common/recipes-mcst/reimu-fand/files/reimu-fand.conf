# reimu-fand: fan control of REIMU-5564. Every setting below is commented out
# and shows its built-in default; uncomment and change what you need, then
#   reimu-fand --check-config        (prints errors and the effective values)
#   systemctl reload reimu-fand        (SIGHUP: re-read, the fans keep going)
# A bad value is reported (journal, D-Bus Json "config_errors") and the
# default kept. Curves set over D-Bus (SetCurve) are saved here.
#
# Curves: "TEMP:DUTY ..." (°C:%), 2..8 points, temperatures rising, duties
# not falling, each between FLOOR and 100, the last one 100. Linear between
# the points, the first point's duty below it, 100 above the last. A zone's
# duty is the highest of its inputs' curves. CPU defaults follow the board
# device tree's thermal zone (trips 40..75 °C, the fans at full speed at 75).
#
#CPU_PCS_CURVE="45:30 55:38 60:47 65:60 70:80 75:100"
#CPU_VRM_CURVE="80:30 95:50 105:75 115:100"
#BOARD_PCS_CURVE="50:30 60:40 65:55 70:75 75:100"
#BOARD_VRM_CURVE="80:30 95:50 105:75 115:100"
#BOARD_IOHUB_CURVE="75:30 85:50 92:75 98:100"
# the host's GPU (RX 5700 XT, in front of the IOHUB), from reimu-hostlink:
# its junction temperature in m°C, the file gone when stale. Optional: no
# file = no input (never a fail-safe). GPU_TEMP_FILE=none: not used
#BOARD_GPU_CURVE="65:30 75:45 85:70 95:100"
#GPU_TEMP_FILE=/run/reimu-hostlink/gpu-temp
# (BOARD_*/CPU_VRM_CURVE=none: input not used; the PCS input can't be off)
#
# the lowest duty, %: no curve nor manual setting goes below it (20..100)
#FLOOR=30
# °C a temperature must fall before the duty follows it down (0..10)
#HYSTERESIS=3
# how fast the duty follows its curves, %/s (fail-safe: 100 % at once)
#SLEW_UP=10
#SLEW_DOWN=1
#
# a sensor not read for this long: its zones 100 %; a fan chip not driven
# for this long: every fan 100 % and the fan fault LED
#STALE_SEC=5
# after the host powers on, the bus is left alone this long (its boot)
#SETTLE_SEC=30
# on taking control (start, power-on): 100 % this long, then down slowly
#START_FULL_SEC=15
# manual mode goes back to auto unless confirmed within (D-Bus Confirm)
#MANUAL_TIMEOUT_SEC=600
#POLL_MS=1000
#
# each fan's useful duty range, %: a zone's FLOOR..100 is spread over it,
# and 100 is always full scale (fail-safe). The X37 CPU fan (PWM-driven,
# 3-wire) saturates at ~60 % (~2700 rpm) and is ~1650 rpm at 50 %, so its
# curve would otherwise be "full speed" from 60 % up. Manual duties
# (SetDuty) are zone duties too; the fans' own are in the Json "fans".
#CPU_FAN_MIN_DUTY=35
#CPU_FAN_MAX_DUTY=65
#BOARD_FAN_MAX_DUTY=100
#CASE_FAN_MAX_DUTY=100
#
# CPU fan tachometer. TACH_MODE (LM96163 0x4A bits 1:0, set at every
# power-on, read back; nothing else of the chip is changed): accurate (10:
# steady readings down to 30 % on this PWM-driven 3-wire fan), least (11,
# what the platform sets: readings swing and drop to 0 below 50 %),
# traditional (00). The fan is judged by its best reading of the last
# TACH_ALARM_SEC: below TACH_MIN_RPM at a duty of TACH_VALID_DUTY or more
# (TACH_VALID_DUTY_OTHER unless the chip took the accurate mode): fan
# failure; at a lower duty the fan runs at full speed for TACH_VERIFY_SEC to
# check it, and fails if still below. Failure: every fan 100 %, LED; cleared
# after TACH_CLEAR_SEC good (3 alarms in an hour: kept until ClearAlarms).
# A stopped fan alarms within 8 s (14 s when checked at full speed).
#CPU_FAN_TACH=yes
#TACH_MODE=accurate
#TACH_MIN_RPM=400
#TACH_ALARM_SEC=8
#TACH_VERIFY_SEC=6
#TACH_VALID_DUTY=30
#TACH_VALID_DUTY_OTHER=50
#TACH_CLEAR_SEC=60
#
# EMC2305 watchdog in continuous mode: its fans go to 100 % by themselves
# when not written for 4 s (the BMC hangs, the daemon stops)
#EMC_WATCHDOG=yes
# the host state says off (or can't be read) but the platform devices
# answer: the platform is on
#HOST_PROBE=yes
#
# the devices (BMC I2C bus:address)
#CPU_FAN=6:0x4c
#BOARD_FAN=2:0x4c
#IOHUB=2:0x4c
#CASE_FANS="2:0x2c 2:0x2e"
#PCS_BUS=5
#PCS_ADDRS="0x20 0x21 0x22 0x23 0x24 0x25 0x26"
#VRM_BUS=6
#VRM_ADDRS="0x44 0x45 0x46"
