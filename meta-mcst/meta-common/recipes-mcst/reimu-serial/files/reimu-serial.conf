# REIMU serial ports served by reimu-serial (web UI "Консоль", SoL over SSH).
#
# Format, one port per line:
#   name device baud [lines=N] [rawlog=PATH] [console] [title...]
#
#   name     short identifier (used in /run/reimu-serial/<name>.pty and logs)
#   device   tty of the BMC connected to the platform's COM port
#   baud     initial speed (can be changed from the web UI, kept in
#            /var/lib/reimu-serial/<name>.baud)
#   lines=N  history size, lines with timestamps (default 20000)
#   rawlog=  also write raw data to this file (logrotate-compatible)
#   console  serve this port to bmcweb /console0 and obmc-console clients
#   title    human readable name shown in the web UI
#
# History with per-line timestamps is kept in /var/log/reimu-serial/<name>.log
# (RAM) and printed by: reimu-serial --dump <name> [-n lines] [-f]
#
host /dev/ttyS0 115200 lines=20000 rawlog=/var/log/sol.log console Консоль платформы (COM1)
#com2 /dev/ttyS2 115200 lines=20000 Второй COM-порт платформы
