# reimu-hostlink: the BMC's end of the host agent (reimu-hostd, see
# meta-mcst/tools/host/README.md). Every setting below is commented out and
# shows its built-in default; uncomment and change what you need, then
#   reimu-hostlink --check-config
#   systemctl reload reimu-hostlink      (PORT, IFACE: systemctl restart)
#
# TCP (TLS) and UDP (discovery) port, on [::] (IPv6 and IPv4)
#PORT=5564
# only these interfaces, a socket each (the board's LAN and the USB network
# with the host, usb0 of reimu-usbnet; eth1 never): at most 4, empty = any.
# One missing (usb0 with the USB network off) is listened on once it is there.
# The pairing string's MAC and IPv4 address: the first one's
#IFACE=eth0 usb0
# IPv4 peers too (the fallback when IPv6 link-local doesn't work)
#ALLOW_IPV4=yes
# a ping to the agent this often; the agent counts as lost after LOST_SEC
# without a connection (a warning event)
#PING_SEC=10
#LOST_SEC=60
#AUTH_TIMEOUT_SEC=10
#CONTROL_TIMEOUT_SEC=30
# how long the pairing token of «Подключить агент хоста» is valid
#PAIR_TTL_SEC=900
# bmcweb's certificate: the page's install command pins its key (curl
# --pinnedpubkey), the pin comes with Pair()
#HTTPS_CERT=/etc/ssl/certs/https/server.pem
# the installer's USB disk for the host (AgentDisk, «USB-диск с установщиком»)
#DISK_HELPER=/usr/libexec/reimu-agent-disk
# the USB network with the host (UsbNet, UsbNetSet: «USB-сеть с хостом» on the
# page Хост): its status, internet for the host through the BMC's port
#USBNET_HELPER=/usr/libexec/reimu-usbnet
# reimu-kvm's port: where the host's H.264 is (the agent's address and the port
# of its reimu-h264), or why there is none, every 2 s on loopback; 0: not told
#KVM_PORT=8443
# GPU temperatures, °C: a warning, a critical event (the thresholds of the
# D-Bus sensors too)
#GPU_EDGE_WARN=85
#GPU_EDGE_CRIT=95
#GPU_JUNCTION_WARN=95
#GPU_JUNCTION_CRIT=105
#GPU_MEM_WARN=95
#GPU_MEM_CRIT=105
# reimu-fand's Турбо puts the GPU fan to 100 % as well
#FOLLOW_FAND_TURBO=yes
# warning and critical events as phosphor-logging entries (Redfish EventLog)
#LOGGING=yes
